<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffb6e1">
<title>▲ TAPE.FX v0.1.03 ▲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS (VAPORDECK family look) ============ */
  :root {
    --pink-50:  #fff0f8;
    --pink-100: #ffd9ec;
    --pink-200: #ffb6e1;
    --pink-300: #ff99cc;
    --pink-400: #ff66b2;
    --pink-500: #ff1493;
    --pink-600: #c71585;
    --pink-shadow: #87366d;
    --cyan: #80ffff;
    --black: #0a0a0a;
    --white: #ffffff;
    --win-bg: #ffd9ec;
    --title-grad: linear-gradient(90deg, #ff1493 0%, #ff66b2 50%, #ff99cc 100%);
    --inset-light: #ffe5f3;
    --inset-dark:  #b87aa3;
    --lane-a: #1c0f1e;
    --lane-b: #231327;
    --rec: #ff2a55;
    --head-w: 190px;
    --top-h: 44px;
    --panel-h: 230px;
    --sb: 18px;
  }
  @media (max-height: 520px) {
    :root { --head-w: 150px; --top-h: 40px; --panel-h: 128px; --sb: 22px; }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'VT323', monospace;
    color: var(--black);
    background-color: var(--pink-200);
    background-image: conic-gradient(from 0deg at 50% 50%,
      rgba(0,0,0,0.18) 0% 25%, rgba(255,255,255,0.55) 0% 50%,
      rgba(0,0,0,0.18) 0% 75%, rgba(255,255,255,0.55) 0% 100%);
    background-size: 28px 28px;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  input, select, textarea, button { font-family: inherit; }
  input[type=text], input[type=number], select, textarea { user-select: text; -webkit-user-select: text; }

  .app {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    display: flex; flex-direction: column;
  }

  /* ============ TOP BAR ============ */
  .topbar {
    flex: 0 0 var(--top-h);
    display: flex; align-items: center; gap: 5px;
    padding: 0 6px;
    background: var(--win-bg);
    border-bottom: 2px solid var(--black);
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
    touch-action: pan-x;
  }
  .topbar::-webkit-scrollbar { display: none; }
  .logo {
    flex: 0 0 auto;
    background: var(--title-grad);
    color: var(--white);
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    padding: 6px 8px;
    border: 2px solid var(--black);
    text-shadow: 1px 1px 0 var(--pink-shadow);
    white-space: nowrap;
  }
  .logo small { font-family: 'VT323', monospace; font-size: 13px; opacity: .9; margin-left: 4px; }
  body:not(.tempo) .tempo-only { display: none !important; }
  .sep { flex: 0 0 2px; height: 26px; background: var(--inset-dark); opacity: .5; }

  .t-btn {
    flex: 0 0 auto;
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    min-width: 30px; height: 28px; padding: 0 7px;
    background: var(--pink-200);
    border: 2px solid var(--black);
    box-shadow: inset 1px 1px 0 var(--white), inset -1px -1px 0 var(--inset-dark), 2px 2px 0 var(--black);
    cursor: pointer; color: var(--black); line-height: 1; white-space: nowrap;
  }
  .t-btn:active { box-shadow: inset -1px -1px 0 var(--white), inset 1px 1px 0 var(--inset-dark); transform: translate(2px,2px); }
  .t-btn.on { background: var(--pink-500); color: var(--white); text-shadow: 1px 1px 0 var(--pink-shadow); box-shadow: inset 1px 1px 0 var(--pink-shadow), 2px 2px 0 var(--black); }
  .t-btn.rec { color: var(--rec); }
  .t-btn.rec.on { background: var(--rec); color: var(--white); animation: recPulse 1s ease-in-out infinite; }
  .t-btn[disabled] { opacity: .4; pointer-events: none; }
  @keyframes recPulse { 50% { filter: brightness(1.25); } }

  .lcd {
    flex: 0 0 auto;
    font-family: 'VT323', monospace; font-size: 21px; line-height: 1;
    min-width: 108px; height: 30px; padding: 4px 8px 0;
    background: #1a0a1e; color: var(--cyan);
    border: 2px solid var(--black);
    box-shadow: inset 2px 2px 0 #000;
    text-shadow: 0 0 6px rgba(128,255,255,.6);
    text-align: center; cursor: pointer; white-space: nowrap;
  }
  .lcd small { font-size: 12px; color: var(--pink-300); text-shadow: none; }
  .mini-field {
    flex: 0 0 auto; display: flex; align-items: center; gap: 3px;
    font-family: 'Press Start 2P', monospace; font-size: 7px; color: var(--pink-shadow);
  }
  .mini-field input, .mini-field select {
    font-family: 'VT323', monospace; font-size: 17px;
    width: 52px; height: 26px; padding: 0 3px;
    border: 2px solid var(--black); background: var(--white);
    box-shadow: inset 1px 1px 0 var(--inset-dark);
    color: var(--black);
  }
  .mini-field select { width: auto; }

  /* ============ MAIN (headers + timeline) ============ */
  .main { flex: 1 1 auto; display: flex; min-height: 0; position: relative; border-bottom: 2px solid var(--black); }
  .heads {
    flex: 0 0 var(--head-w);
    position: relative; overflow: hidden;
    background: var(--win-bg);
    border-right: 2px solid var(--black);
  }
  .heads-corner {
    position: absolute; left: 0; right: 0; top: 0; height: 30px; z-index: 3;
    background: var(--pink-300);
    border-bottom: 2px solid var(--black);
    display: flex; align-items: center; justify-content: space-between; padding: 0 5px;
    font-family: 'Press Start 2P', monospace; font-size: 7px; color: var(--white);
    text-shadow: 1px 1px 0 var(--pink-shadow);
  }
  .heads-list { position: absolute; left: 0; right: 0; top: 30px; will-change: transform; }
  .th {
    position: relative;
    border-bottom: 1px solid var(--inset-dark);
    background: var(--pink-50);
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    padding: 3px 4px 3px 9px;
    overflow: hidden;
  }
  .th.sel { background: var(--pink-200); }
  .th .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-right: 1px solid var(--black); }
  .th .nm {
    font-family: 'VT323', monospace; font-size: 16px; line-height: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--pink-shadow);
    padding-right: 14px;
  }
  .th .row { display: flex; gap: 3px; }
  .th .meter { position: absolute; right: 3px; top: 3px; bottom: 3px; width: 6px; background: #1a0a1e; border: 1px solid var(--black); }
  .th .meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(0deg, #6effc8, #ffe066 70%, #ff2a55 95%); }
  .hb {
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    height: 20px; min-width: 22px; padding: 0 4px;
    background: var(--pink-100);
    border: 2px solid var(--black);
    box-shadow: inset 1px 1px 0 var(--white), inset -1px -1px 0 var(--inset-dark);
    cursor: pointer; color: var(--black); line-height: 1;
  }
  .hb.arm.on { background: var(--rec); color: var(--white); }
  .hb.mute.on { background: #ffb02e; }
  .hb.solo.on { background: #6effc8; }
  .hb.mon.on { background: var(--cyan); }
  .hb.fx.on { background: var(--pink-400); color: var(--white); }
  .add-track {
    margin: 6px; width: calc(100% - 12px);
    font-family: 'Press Start 2P', monospace; font-size: 7px; padding: 8px 4px;
    background: var(--pink-100); border: 2px dashed var(--pink-shadow); color: var(--pink-shadow); cursor: pointer;
  }

  .view { flex: 1 1 auto; position: relative; min-width: 0; overflow: hidden; background: var(--lane-a); }
  .view canvas { position: absolute; left: 0; display: block; }
  #ruler { top: 0; height: 30px; cursor: pointer; }
  #lanes { top: 30px; touch-action: none; }
  .playhead { position: absolute; top: 0; bottom: var(--sb); width: 2px; left: 0; background: var(--white); box-shadow: 0 0 6px var(--pink-500); pointer-events: none; z-index: 4; will-change: transform; }
  .playhead::before { content: ''; position: absolute; top: 0; left: -6px; border: 7px solid transparent; border-top: 9px solid var(--white); }
  /* real scrollbars: drag the pink handle, or tap the bar to jump */
  .hscroll, .vscroll { position: absolute; z-index: 5; background: #2a1630; touch-action: none; cursor: pointer; }
  .hscroll { left: 0; right: var(--sb); bottom: 0; height: var(--sb); border-top: 2px solid var(--black); }
  .vscroll { right: 0; top: 30px; bottom: var(--sb); width: var(--sb); border-left: 2px solid var(--black); }
  .scorner { position: absolute; right: 0; bottom: 0; width: var(--sb); height: var(--sb); background: var(--pink-300); border-top: 2px solid var(--black); border-left: 2px solid var(--black); z-index: 5; }
  .hscroll .thumb, .vscroll .thumb {
    position: absolute; background: var(--pink-300); border: 2px solid var(--black);
    box-shadow: inset 1px 1px 0 var(--white), inset -1px -1px 0 var(--inset-dark); cursor: grab;
  }
  .hscroll .thumb { top: 2px; bottom: 2px; min-width: 40px; }
  .vscroll .thumb { left: 2px; right: 2px; min-height: 30px; }
  .hscroll .thumb.drag, .vscroll .thumb.drag { background: var(--pink-500); }

  /* ============ BOTTOM PANEL ============ */
  .panel { flex: 0 0 auto; display: flex; flex-direction: column; background: var(--win-bg); }
  .panel.closed .pbody { display: none; }
  .ptabs { display: flex; align-items: stretch; gap: 2px; padding: 3px 4px 0; background: var(--pink-100); border-bottom: 2px solid var(--black); overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
  .ptabs::-webkit-scrollbar { display: none; }
  .ptabs button {
    flex: 0 0 auto; padding: 6px 10px 5px;
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    background: var(--pink-200); border: 2px solid var(--black); border-bottom: none;
    color: var(--black); cursor: pointer;
    box-shadow: inset 1px 1px 0 var(--inset-light), inset -1px 0 0 var(--inset-dark);
  }
  .ptabs button.active { background: var(--win-bg); color: var(--pink-600); }
  .ptabs .grow { flex: 1; }
  .ptabs .ctx { font-family: 'VT323', monospace; font-size: 15px; color: var(--pink-shadow); align-self: center; padding: 0 8px; white-space: nowrap; }
  .pbody { height: var(--panel-h); overflow: auto; padding: 8px; touch-action: pan-x pan-y; }
  .pane { display: none; }
  .pane.active { display: block; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px 14px; }
  .group {
    padding: 12px 8px 8px;
    background: var(--pink-50);
    border: 2px solid var(--black);
    box-shadow: inset 1px 1px 0 var(--white);
    position: relative; margin-top: 6px;
  }
  .group-title {
    position: absolute; top: -9px; left: 8px;
    background: var(--win-bg); padding: 0 6px;
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    color: var(--pink-600); border: 1px solid var(--black);
  }
  .rowc { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .rowc label { flex: 0 0 auto; font-size: 15px; min-width: 64px; }
  .rowc .val {
    font-size: 14px; color: var(--pink-600); min-width: 54px; text-align: right;
    background: var(--white); border: 1px solid var(--black); padding: 0 3px;
    box-shadow: inset 1px 1px 0 var(--inset-dark);
  }
  .slider {
    -webkit-appearance: none; appearance: none;
    flex: 1; min-width: 60px; height: 13px;
    border: 2px solid var(--black);
    box-shadow: inset 1px 1px 0 var(--inset-dark), inset -1px -1px 0 var(--white);
    background: linear-gradient(90deg, var(--pink-400), var(--pink-200));
    cursor: pointer; padding: 0; touch-action: pan-y;
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 22px; background: var(--pink-100);
    border: 2px solid var(--black);
    box-shadow: inset 1px 1px 0 var(--white), inset -1px -1px 0 var(--inset-dark);
    border-radius: 0; margin-top: -6px;
  }
  .slider::-moz-range-thumb { width: 14px; height: 22px; background: var(--pink-100); border: 2px solid var(--black); border-radius: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    font-size: 15px; padding: 4px 8px; line-height: 1;
    background: var(--pink-100); border: 2px solid var(--black);
    box-shadow: inset 1px 1px 0 var(--white), inset -1px -1px 0 var(--inset-dark);
    cursor: pointer; color: var(--black); white-space: nowrap;
  }
  .chip.on { background: var(--pink-500); color: var(--white); text-shadow: 1px 1px 0 var(--pink-shadow); }
  .chip:active { transform: translate(1px,1px); }
  .chip.sw { width: 26px; height: 22px; padding: 0; }

  .btn {
    font-family: 'Press Start 2P', monospace; font-size: 8px;
    padding: 7px 9px; line-height: 1;
    background: var(--pink-200); border: 2px solid var(--black);
    box-shadow: inset 1px 1px 0 var(--white), inset -1px -1px 0 var(--inset-dark), 2px 2px 0 var(--black);
    cursor: pointer; color: var(--black); white-space: nowrap;
  }
  .btn:active { box-shadow: none; transform: translate(2px,2px); }
  .btn.primary { background: var(--pink-400); color: var(--white); text-shadow: 1px 1px 0 var(--pink-shadow); }
  .btn.danger { background: #ff4f6d; color: var(--white); }
  .btn.on { background: var(--pink-500); color: var(--white); }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .btn.full { width: 100%; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .help { font-size: 14px; color: var(--pink-shadow); line-height: 1.25; }
  .txt {
    font-size: 17px; height: 26px; padding: 0 5px;
    border: 2px solid var(--black); background: var(--white); color: var(--black);
    box-shadow: inset 1px 1px 0 var(--inset-dark); min-width: 0;
  }

  /* fx chain */
  .fx-unit { border: 2px solid var(--black); background: var(--white); margin: 6px 0; }
  .fx-unit .fx-h { display: flex; align-items: center; gap: 4px; padding: 3px 4px; background: var(--pink-100); border-bottom: 1px solid var(--inset-dark); }
  .fx-unit .fx-h b { flex: 1; font-family: 'Press Start 2P', monospace; font-size: 7px; color: var(--pink-600); font-weight: normal; cursor: pointer; }
  .fx-unit.off .fx-b { opacity: .4; }
  .fx-unit .fx-b { padding: 2px 6px 4px; }
  .fx-unit.collapsed .fx-b { display: none; }

  /* mixer */
  .mixer { display: flex; gap: 4px; height: 100%; min-height: 200px; }
  .strip {
    flex: 0 0 78px; width: 78px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 4px 3px; background: var(--pink-50); border: 2px solid var(--black); position: relative;
  }
  .strip.master { flex-basis: 90px; width: 90px; background: var(--pink-200); }
  .mixer input[type=range] { accent-color: var(--pink-500); }
  .panel.mix .pbody { height: min(62vh, 300px); }
  .strip .snm { font-size: 14px; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--pink-shadow); border-bottom: 3px solid var(--pink-400); }
  .strip .fwrap { flex: 1; display: flex; gap: 4px; align-items: stretch; min-height: 70px; width: 100%; justify-content: center; }
  .strip .vfader { writing-mode: vertical-lr; direction: rtl; width: 22px; flex: 0 0 22px; }
  .strip .smeter { width: 10px; background: #1a0a1e; border: 1px solid var(--black); position: relative; }
  .strip .smeter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(0deg, #6effc8, #ffe066 70%, #ff2a55 95%); }
  .strip .sdb { font-size: 13px; color: var(--pink-600); }
  .strip .knob { width: 100%; display: flex; align-items: center; gap: 2px; font-size: 12px; }
  .strip .knob input { flex: 1; min-width: 0; width: 100%; height: 12px; margin: 0; }
  .strip .row { display: flex; gap: 2px; }

  /* ============ MODAL ============ */
  .modal-back { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(20,0,15,.55); backdrop-filter: blur(2px); align-items: center; justify-content: center; padding: 14px; }
  .modal-back.show { display: flex; }
  .modal { width: 100%; max-width: 460px; max-height: 100%; display: flex; flex-direction: column; background: var(--win-bg); border: 2px solid var(--black); box-shadow: 4px 4px 0 var(--black); }
  .modal.wide { max-width: 640px; }
  .modal-title {
    flex: 0 0 auto; background: var(--title-grad); color: var(--white); padding: 6px 8px;
    font-family: 'Press Start 2P', monospace; font-size: 8px;
    border-bottom: 2px solid var(--black); display: flex; justify-content: space-between; align-items: center;
    text-shadow: 1px 1px 0 var(--pink-shadow);
  }
  .modal-title .x { cursor: pointer; font-size: 14px; padding: 0 4px; }
  .modal-body { padding: 10px 12px 12px; overflow: auto; touch-action: pan-y; }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .proj-row { display: flex; align-items: center; gap: 6px; padding: 5px 6px; margin: 4px 0; background: var(--white); border: 2px solid var(--black); }
  .proj-row .pn { flex: 1; font-size: 17px; color: var(--pink-shadow); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-row.cur { background: var(--pink-100); }

  .toast {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: var(--win-bg); border: 2px solid var(--black); box-shadow: 3px 3px 0 var(--black);
    padding: 6px 12px; font-size: 16px; color: var(--pink-shadow);
    z-index: 300; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  .busy { position: fixed; inset: 0; z-index: 250; background: rgba(5,0,12,.78); display: none; align-items: center; justify-content: center; }
  .busy.show { display: flex; }
  .busy .bw { width: 300px; background: var(--win-bg); border: 2px solid var(--black); box-shadow: 5px 5px 0 var(--black); }
  .busy .bt { background: var(--title-grad); color: #fff; font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 6px 8px; border-bottom: 2px solid var(--black); }
  .busy .bm { padding: 10px 12px 4px; font-size: 18px; color: var(--pink-shadow); }
  .busy .track { margin: 6px 12px 12px; height: 14px; border: 2px solid var(--black); background: var(--pink-100); }
  .busy .track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff1493, #ff99cc); transition: width .2s; }

  /* tuner */
  .tuner-note { font-family: 'Press Start 2P', monospace; font-size: 44px; text-align: center; color: var(--pink-600); padding: 14px 0 6px; }
  .tuner-bar { position: relative; height: 22px; border: 2px solid var(--black); background: linear-gradient(90deg, #ff99cc, #fff 45%, #6effc8 50%, #fff 55%, #ff99cc); }
  .tuner-bar i { position: absolute; top: -4px; bottom: -4px; width: 4px; left: 50%; background: var(--black); transition: left .08s; }

  /* portrait warning */
  .rotate { display: none; position: fixed; inset: 0; z-index: 400; background: rgba(26,10,30,.94); color: var(--pink-200); align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; font-size: 22px; padding: 30px; }
  .rotate b { font-family: 'Press Start 2P', monospace; font-size: 12px; color: var(--white); }
  @media (orientation: portrait) and (max-width: 700px) { .rotate { display: flex; } }

  /* phone landscape: compact controls */
  @media (max-height: 520px) {
    .hb { min-width: 20px; padding: 0 2px; font-size: 6px; height: 19px; }
    .th .row { gap: 2px; }
    .th .nm { font-size: 15px; }
    .t-btn { height: 26px; font-size: 8px; padding: 0 6px; }
    .lcd { height: 28px; font-size: 19px; min-width: 96px; }
    .btn { font-size: 7px; padding: 6px 7px; }
    .pbody { padding: 6px; }
  }

</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar" id="topbar">
    <div class="logo">▲ TAPE.FX<small>v0.1.03</small></div>
    <button class="t-btn" id="bHome" title="to start (Home)">⏮</button>
    <button class="t-btn" id="bPlay" title="play / pause (Space)">▶</button>
    <button class="t-btn" id="bStop" title="stop">■</button>
    <button class="t-btn rec" id="bRec" title="record (R)">● REC</button>
    <div class="lcd" id="lcd" title="tap to switch bars / time">1.1.00</div>
    <div class="sep"></div>
    <button class="t-btn" id="bTempo" title="tempo, bars, click and snap — off unless you want them">♩ TEMPO</button>
    <label class="mini-field tempo-only">BPM<input type="number" id="fBpm" min="30" max="300" step="0.1" value="120"></label>
    <label class="mini-field tempo-only">TIME<select id="fSig"><option value="2">2/4</option><option value="3">3/4</option><option value="4" selected>4/4</option><option value="5">5/4</option><option value="6">6/8</option><option value="7">7/8</option></select></label>
    <button class="t-btn" id="bLoop" title="loop (L)">⟲ LOOP</button>

/* ---------- project model ---------- */

/* ---------- undo / redo ---------- */
const HIST = { undo: [], redo: [] };
function snap() {
  HIST.undo.push(JSON.stringify(P));
  if (HIST.undo.length > 300) HIST.undo.shift();
  HIST.redo.length = 0;
  updateUndoBtns();
}
function undo() {
  if (!HIST.undo.length) return;
  HIST.redo.push(JSON.stringify(P));
  P = JSON.parse(HIST.undo.pop());
  afterHistory();
}
function redo() {
  if (!HIST.redo.length) return;
  HIST.undo.push(JSON.stringify(P));
  P = JSON.parse(HIST.redo.pop());
  afterHistory();
}
function afterHistory() {
  for (const id of Array.from(UI.selClips)) if (!findClip(id)) UI.selClips.delete(id);
  if (UI.selTrack && !findTrack(UI.selTrack)) UI.selTrack = P.tracks[0] ? P.tracks[0].id : null;
  updateUndoBtns();
  changed('all');
}
function updateUndoBtns() {
  $('#bUndo').disabled = !HIST.undo.length;
  $('#bRedo').disabled = !HIST.redo.length;
}

    else if (L.e > L.s && t > L.s && t < L.e) RDRAG = { m: 'lmove', t0: t, s: L.s, e: L.e };
    else RDRAG = { m: 'lnew', t0: snapT(t, true) };
    RDRAG.moved = false;
    return;
  }
  // markers
  for (const m of P.markers) if (Math.abs(xOf(m.t) - x) < (touch ? 12 : 7)) { snap(); RDRAG = { m: 'marker', mk: m, moved: false, x0: x, t0: m.t }; return; }
  RDRAG = { m: 'seek' };
  if (!E.recording) { E.pos = Math.max(0, snapT(t)); drawAll(); }
});
ruler.addEventListener('pointermove', e => {
  if (!RDRAG) return;
  const r = ruler.getBoundingClientRect(), x = e.clientX - r.left, t = tOf(x), L = P.loop;
  RDRAG.moved = true;
  if (RDRAG.m === 'ls') { L.s = clamp(snapT(t), 0, L.e - gridSec() * 0.25); }
  else if (RDRAG.m === 'le') { L.e = Math.max(L.s + gridSec() * 0.25, snapT(t)); }
  else if (RDRAG.m === 'lmove') { const d = snapT(RDRAG.s + (t - RDRAG.t0)) - RDRAG.s; const len = RDRAG.e - RDRAG.s; L.s = Math.max(0, RDRAG.s + d); L.e = L.s + len; }
  else if (RDRAG.m === 'lnew') { const a = RDRAG.t0, b = snapT(t, true); L.s = Math.max(0, Math.min(a, b)); L.e = Math.max(a, b); if (L.e - L.s > 0.01) L.on = true; }
  else if (RDRAG.m === 'marker') { if (Math.abs(x - RDRAG.x0) > 4) { RDRAG.mk.t = Math.max(0, snapT(t)); } }
  else if (RDRAG.m === 'seek') { if (!E.recording && !E.playing) E.pos = Math.max(0, snapT(t)); }
  updateTransportUI(); drawAll();
});
ruler.addEventListener('pointerup', e => {
  if (!RDRAG) return;
  const r = ruler.getBoundingClientRect(), t = tOf(e.clientX - r.left);
  const d = RDRAG; RDRAG = null;
  if (d.m === 'seek') { seek(snapT(t)); return; }
  if (d.m === 'marker') { if (d.mk.t === d.t0) { HIST.undo.pop(); updateUndoBtns(); markerModal(d.mk); } else changed('marks'); return; }
  if (d.m === 'lnew' && !(P.loop.e - P.loop.s > 0.01 && d.moved)) { HIST.undo.pop(); updateUndoBtns(); drawAll(); return; }
  if (d.m === 'lmove' && !d.moved) { HIST.undo.pop(); updateUndoBtns(); return; }
  changed('loop');
});

$('#paneClip').addEventListener('click', e => {
  const col = e.target.closest('[data-ccol]');

function clipAction(a) {
  const sel = selectedClips();
  switch (a) {
    case 'import': $('#fileAudio').click(); return;
    case 'none': setSel([]); return;
    case 'all': setSel(P.tracks.flatMap(t => t.clips.map(c => c.id))); return;
    case 'multi': UI.multi = !UI.multi; toast(UI.multi ? 'multi-select ON: tap clips to add them' : 'multi-select off'); renderPanel(); return;
    case 'slip': UI.slip = !UI.slip; toast(UI.slip ? 'drag a selected clip to slide the audio inside it' : 'slide audio off'); renderPanel(); return;
    case 'copy': copyClips(); return;
    case 'paste': pasteClips(); return;
    case 'split': splitAtPlayhead(); return;
  }
  if (!sel.length) return;
  snap();
  switch (a) {
    case 'del': for (const { t, c } of sel) t.clips.splice(t.clips.indexOf(c), 1); UI.selClips.clear(); break;
    case 'dup': {
      const s = Math.min(...sel.map(x => x.c.start)), e = Math.max(...sel.map(x => clipEnd(x.c)));
      const d = P.snap ? Math.ceil((e - s) / gridSec() - 1e-6) * gridSec() : e - s;
      const ids = [];
      for (const { t, c } of sel) { const n = Object.assign({}, c, { id: uid(), start: c.start + d }); t.clips.push(n); ids.push(n.id); }
      UI.selClips = new Set(ids); break;
    }
    case 'repeat': {
      const ids = [];
      for (const { t, c } of sel) { const n = Object.assign({}, c, { id: uid(), start: clipEnd(c) }); t.clips.push(n); ids.push(n.id); }
      UI.selClips = new Set(ids); break;
    }
    case 'rev': { const v = !sel[0].c.rev; sel.forEach(({ c }) => c.rev = v); break; }
    case 'mute': { const v = !sel[0].c.mute; sel.forEach(({ c }) => c.mute = v); break; }
    case 'norm': {
      for (const { c } of sel) {
        const b = BUF.get(c.buf); if (!b) continue;
        const i0 = Math.floor(c.off * b.sr), i1 = Math.min(b.len, Math.ceil((c.off + c.len) * b.sr));
        let pk = 0; for (const ch of b.ch) for (let i = i0; i < i1; i++) { const v = Math.abs(ch[i]); if (v > pk) pk = v; }
        if (pk > 0.0001) c.gain = dbToGain(-0.3) / pk;
      }
      toast('normalized'); break;
    }
    case 'rename': { const c = sel[0].c; promptText('RENAME CLIP', c.name || '', v => { if (v != null) { c.name = v.slice(0, 40); changed('clips'); } }); return; }
  }
  changed('clips');
}
function splitAtPlayhead() {
  const T = songNow();
  let targets = selectedClips().filter(({ c }) => c.start < T - 0.005 && clipEnd(c) > T + 0.005);
  if (!targets.length) {
    const t = findTrack(UI.selTrack);
    if (t) targets = t.clips.filter(c => c.start < T - 0.005 && clipEnd(c) > T + 0.005).map(c => ({ t, c }));
  }
  if (!targets.length) { toast('put the play line over a clip to split it'); return; }
  snap();
  const ids = [];
  for (const { t, c } of targets) {
    const k = (T - c.start) * c.rate;
    const right = Object.assign({}, c, { id: uid(), start: T, fi: 0 });
    if (!c.rev) { right.off = c.off + k; right.len = c.len - k; c.len = k; }
    else { right.off = c.off; right.len = c.len - k; c.off = c.off + c.len - k; c.len = k; }
    c.fo = 0;
    t.clips.splice(t.clips.indexOf(c) + 1, 0, right);
    ids.push(c.id, right.id);
  }
  UI.selClips = new Set(ids);
  changed('clips');
}
function copyClips() {
  const sel = selectedClips(); if (!sel.length) { toast('select clips to copy'); return; }
  const s = Math.min(...sel.map(x => x.c.start)), ti0 = Math.min(...sel.map(x => P.tracks.indexOf(x.t)));
  CLIPBOARD = sel.map(({ t, c }) => ({ dt: P.tracks.indexOf(t) - ti0, clip: Object.assign({}, c, { start: c.start - s }) }));
  toast('copied ' + sel.length + ' clip' + (sel.length > 1 ? 's' : ''));
  renderPanel();
}
function pasteClips() {
  if (!CLIPBOARD) return;
  snap();
  const at = snapT(songNow()), base = Math.max(0, P.tracks.findIndex(t => t.id === UI.selTrack));
  const ids = [];
  for (const it of CLIPBOARD) {
    const t = P.tracks[Math.min(P.tracks.length - 1, base + it.dt)]; if (!t) continue;
    const n = Object.assign({}, it.clip, { id: uid(), start: at + it.clip.start });
    t.clips.push(n); ids.push(n.id);
  }
  UI.selClips = new Set(ids);
  changed('clips');
}

    }

function bindFxChain(root, list, onChange) {
  list.forEach(f => {
    const d = FXDEF[f.type];
    d.params.forEach(([k, , , , , , unit]) => {
      const fm = unit === 'db' ? (v => (v > 0 ? '+' : '') + (+v).toFixed(1) + ' dB') : unit === 'hz' ? F.hz : unit === 'ms' ? F.ms : unit === 'x' ? F.x : F.pct;
      bindSlider('fx_' + f.id + '_' + k, fm, v => { f.p[k] = v; onChange(true); });
    });
  });
  root.querySelector('.fxchain').addEventListener('click', e => {
    const add = e.target.closest('[data-addfx]');
    if (add) { snap(); list.push(newFx(add.dataset.addfx)); onChange(false); return; }
    const unit = e.target.closest('[data-fx]'); if (!unit) return;
    const f = list.find(x => x.id === unit.dataset.fx); if (!f) return;
    const ch = e.target.closest('[data-fchip]');
    if (ch) { snap(); f.p[ch.dataset.fchip] = ch.dataset.v; onChange(false); return; }
    const a = e.target.closest('[data-fa]'); if (!a) return;
    const i = list.indexOf(f);
    if (a.dataset.fa === 'fold') { if (COLLAPSED.has(f.id)) COLLAPSED.delete(f.id); else COLLAPSED.add(f.id); renderPanel(); return; }
    snap();
    if (a.dataset.fa === 'on') f.on = !f.on;
    else if (a.dataset.fa === 'del') list.splice(i, 1);
    else if (a.dataset.fa === 'up' && i > 0) { list.splice(i, 1); list.splice(i - 1, 0, f); }
    else if (a.dataset.fa === 'down' && i < list.length - 1) { list.splice(i, 1); list.splice(i + 1, 0, f); }
    onChange(false);
  });
}

/* ---------- meters ---------- */
const MBUF = new Float32Array(2048);
function peakOf(an) { const n = an.fftSize; an.getFloatTimeDomainData(MBUF.subarray(0, n)); let p = 0; for (let i = 0; i < n; i++) { const v = Math.abs(MBUF[i]); if (v > p) p = v; } return p; }
const meterH = p => p <= 0.0001 ? 0 : clamp((20 * Math.log10(p) + 60) / 60, 0, 1) * 100;
function updateMeters() {
  if (E.G && (E.playing || E.input)) {
    const rows = $$('#headsList .th');
    for (const r of rows) { const TN = E.G.tracks.get(r.dataset.t); const i = r.querySelector('.meter i'); if (TN && i) i.style.height = meterH(peakOf(TN.meter)) + '%'; }
    if (UI.panel === 'mixer') {
      for (const s of $$('#paneMixer .strip[data-t]')) { const TN = E.G.tracks.get(s.dataset.t); const i = s.querySelector('.smeter i'); if (TN && i) i.style.height = meterH(peakOf(TN.meter)) + '%'; }
      const mp = peakOf(E.G.masterMeter), mi = $('#mMeter i'); if (mi) mi.style.height = meterH(mp) + '%';
      const pk = $('#mPeak'); if (pk) { pk.textContent = mp > 0.0001 ? (20 * Math.log10(mp)).toFixed(1) + ' dB' : ''; pk.style.color = mp >= 0.99 ? '#ff2a55' : ''; }
    }
  }
  if (E.input) {
    const p = peakOf(E.input.analyser), lv = '▁▂▃▄▅▆▇█'[Math.min(7, Math.floor(meterH(p) / 12.5))];
    const m = $('#inMeter'); m.textContent = lv; m.style.color = p > 0.95 ? '#ff2a55' : '';
  }
}

/* ---------- the one place every change goes through ---------- */
function changed(kind, opts) {
  opts = opts || {};
  if (!P) return;
  autosave();
  if (kind === 'clips' || kind === 'all' || kind === 'loop') engineSync(kind === 'loop' ? 'clips' : kind);
  else if (kind === 'mix' || kind === 'fx') engineSync('mix');
  renderHeads();
  if (!opts.noPanel) renderPanel(); else updateCtxLine();
  updateTransportUI();
  clampScroll();
  drawAll();
}

async function renderOffline(s0, s1, opt) {

  const dur = Math.max(0.1, s1 - s0 + (opt.tail || 0));

  const G = buildGraph(oc, proj, { offline: true, soloTrack: opt.soloTrack });
  scheduleRange(G, proj, s0, s1, 0, s0);

  openModal('♪ TUNER', '<div class="tuner-note" id="tuNote">—</div><div class="tuner-bar"><i id="tuNeedle"></i></div><p class="help" id="tuInfo" style="text-align:center;margin-top:8px">play or sing one note</p>', { onClose: () => cancelAnimationFrame(TUNE_RAF) });
  const an = E.input.analyser, buf = new Float32Array(an.fftSize), sr = E.ctx.sampleRate;
  const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  let last = 0;
  const loop = ts => {
    TUNE_RAF = requestAnimationFrame(loop);
    if (ts - last < 70) return; last = ts;
    an.getFloatTimeDomainData(buf);
    let rms = 0; for (const v of buf) rms += v * v; rms = Math.sqrt(rms / buf.length);
    if (rms < 0.01) return;
    // autocorrelation
    const n = buf.length; let best = -1, bestC = 0;
    const minLag = Math.floor(sr / 1200), maxLag = Math.floor(sr / 50);
    let prev = 1;
    for (let lag = minLag; lag < Math.min(maxLag, n / 2); lag++) {
      let c = 0; for (let i = 0; i < n / 2; i++) c += buf[i] * buf[i + lag];
      c /= (n / 2) * rms * rms;
      if (c > 0.9 && c < prev) { best = lag - 1; break; }
      if (c > bestC) { bestC = c; best = lag; }
      prev = c;
    }
    if (best <= 0) return;
    const f = sr / best, midi = 69 + 12 * Math.log2(f / 440), nn = Math.round(midi), cents = Math.round((midi - nn) * 100);
    $('#tuNote').textContent = NAMES[((nn % 12) + 12) % 12] + (Math.floor(nn / 12) - 1);
    $('#tuNeedle').style.left = clamp(50 + cents, 0, 100) + '%';
    $('#tuInfo').textContent = f.toFixed(1) + ' Hz · ' + (cents > 0 ? '+' : '') + cents + ' cents';
  };
  TUNE_RAF = requestAnimationFrame(loop);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if ($('#modalBack').classList.contains('show')) { if (e.key === 'Escape') closeModal(); return; }
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (k === 'r' && !mod) record();
  else if (k === 's' && !mod) clipAction('split');
  else if ((k === 'delete' || k === 'backspace') && UI.selClips.size) { e.preventDefault(); clipAction('del'); }
  else if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (mod && k === 'c') { e.preventDefault(); copyClips(); }
  else if (mod && k === 'v') { e.preventDefault(); pasteClips(); }
  else if (mod && k === 'd') { e.preventDefault(); clipAction('dup'); }
  else if (mod && k === 'a') { e.preventDefault(); clipAction('all'); }
  else if (k === 'l' && !mod) $('#bLoop').click();
  else if (k === 'home') $('#bHome').click();
  else if (k === '+' || k === '=') setZoom(UI.zoom * 1.5);
  else if (k === '-' || k === '_') setZoom(UI.zoom / 1.5);
  else if (k === 'escape') setSel([]);
});

/* ---------- start-up ---------- */
window.addEventListener('resize', () => layoutView());
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
window.addEventListener('pagehide', () => saveNow());
async function boot() {
  let p = null;
  try {
    let last = null; try { last = localStorage.getItem('tapefx_last'); } catch (e) {}
    if (last) { const raw = await DB.get('proj', last); if (raw) p = JSON.parse(raw); }
    if (!p) { const all = (await DB.all('proj')).map(r => JSON.parse(r)).sort((a, b) => b.saved - a.saved); p = all[0] || null; }
  } catch (e) { toast('this browser blocks saving — your work will not be kept', 5000); }
  await openProject(p || newProject());
  // audio starts on the first tap (browsers require it)
  const wake = () => { ensureCtx(); document.removeEventListener('pointerdown', wake, true); };
  document.addEventListener('pointerdown', wake, true);
}
if (location.hash === '#debug') window.__tfx = { get P() { return P; }, E, UI, BUF, clipAction, splitAtPlayhead, record, stop, play, seek, doExport, EXP, renderOffline, encodeAudio, addTrack, changed, snap, undo, redo, setSel, newFx, engineSync, songNow, makeZip, offerSave, findClip };
boot();

})();
</script>
